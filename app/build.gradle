plugins { id 'com.android.application' }

android {
    namespace 'ke.co.dasify.dasfund'
    compileSdk 35

    defaultConfig {
        applicationId 'ke.co.dasify.dasfund'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def storeFileProp = project.findProperty('android.injected.signing.store.file')
            def storePasswordProp = project.findProperty('android.injected.signing.store.password')
            def keyAliasProp = project.findProperty('android.injected.signing.key.alias')
            def keyPasswordProp = project.findProperty('android.injected.signing.key.password')
            if (storeFileProp && storePasswordProp && keyAliasProp && keyPasswordProp) {
                storeFile file(storeFileProp)
                storePassword storePasswordProp
                keyAlias keyAliasProp
                keyPassword keyPasswordProp
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (project.hasProperty('android.injected.signing.store.file')) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
